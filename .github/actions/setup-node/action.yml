name: Setup Node
description: Install the pinned Node toolchain with npm cache for web/
inputs:
  node-version:
    description: Node version to install
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: web/package-lock.json
