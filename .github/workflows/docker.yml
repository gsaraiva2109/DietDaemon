name: Docker

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (default: latest)'
        required: false
        default: 'latest'
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/gsaraiva2109/dietdaemon

permissions:
  contents: read
  packages: write
  security-events: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  docker:
    name: Build & Push Docker Image
    runs-on: [self-hosted, homelab, linux, amd64]
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          TAG="${{ inputs.tag }}"
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          if [ "$TAG" = "latest" ]; then
            echo "tags=${{ env.IMAGE_NAME }}:latest,${{ env.IMAGE_NAME }}:sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${{ env.IMAGE_NAME }}:${TAG},${{ env.IMAGE_NAME }}:sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        id: build-and-push
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign image
        run: cosign sign --yes "${{ env.IMAGE_NAME }}@${{ steps.build-and-push.outputs.digest }}"

      - name: Run Trivy image vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: 'v0.73.0'
          image-ref: ${{ env.IMAGE_NAME }}:sha-${{ steps.meta.outputs.sha }}
          format: 'sarif'
          output: 'trivy-image-results.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          trivyignores: '.trivyignore'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4.37.6
        if: always()
        with:
          sarif_file: 'trivy-image-results.sarif'
