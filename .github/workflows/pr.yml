name: PR Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26'
  NODE_VERSION: '22'

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      frontend: ${{ steps.filter.outputs.frontend }}
      coverage: ${{ steps.filter.outputs.go == 'true' || steps.filter.outputs.frontend == 'true' || steps.filter.outputs.sonar == 'true' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'migrations/**'
              - 'cmd/**'
              - 'internal/**'
              - 'core/**'
              - 'adapters/**'
              - 'fixtures/**'
            frontend:
              - 'web/**'
            sonar:
              - '.github/workflows/pr.yml'
              - 'sonar-project.properties'
              - 'Makefile'

  go:
    name: Go (lint, build)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.go == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Vulnerability scan
        run: make govulncheck

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@2026.1

      - name: Static analysis
        run: make staticcheck

      - name: Stub web/dist for go:embed
        run: |
          mkdir -p internal/web/dist
          if [ ! -f internal/web/dist/index.html ]; then
            echo '<html></html>' > internal/web/dist/index.html
          fi

      - name: Build (dietdaemon)
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -o /dev/null ./cmd/dietdaemon

      - name: Build (tune)
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -o /dev/null ./cmd/tune

  frontend:
    name: Frontend (lint, tsc, build)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript check
        run: npx tsc -b --noEmit

      - name: Build
        run: npm run build

  go-coverage:
    name: Go coverage
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.coverage == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download dependencies
        run: go mod download

      - name: Test with coverage
        run: make test-coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage
          path: coverage.out
          retention-days: 1

  frontend-coverage:
    name: Frontend coverage
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.coverage == 'true'
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test with coverage
        run: npm run test:coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: web/coverage/lcov.info
          retention-days: 1

  trivy:
    name: Trivy (secret scan)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.frontend == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Run Trivy filesystem & secret scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: 'v0.73.0'
          scan-type: 'fs'
          scanners: 'secret'
          format: 'sarif'
          output: 'trivy-secrets.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4.37.6
        if: always()
        with:
          sarif_file: 'trivy-secrets.sarif'

  sonarqube:
    name: SonarQube Scan
    runs-on: [self-hosted, homelab, linux, amd64]
    needs: [changes, go, frontend, go-coverage, frontend-coverage]
    if: always() && needs.changes.outputs.coverage == 'true'
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Download Go coverage
        uses: actions/download-artifact@v8.0.1
        with:
          name: go-coverage
          path: .

      - name: Download frontend coverage
        uses: actions/download-artifact@v8.0.1
        with:
          name: frontend-coverage
          path: web/coverage

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [go, frontend, go-coverage, frontend-coverage, sonarqube, trivy]
    if: always()
    steps:
      - name: Check job results
        run: |
          if [[ "${{ needs.go.result }}" == "failure" || "${{ needs.frontend.result }}" == "failure" || "${{ needs.go-coverage.result }}" == "failure" || "${{ needs.frontend-coverage.result }}" == "failure" || "${{ needs.sonarqube.result }}" == "failure" || "${{ needs.trivy.result }}" == "failure" ]]; then
            echo "One or more required jobs failed."
            exit 1
          fi
          echo "All required jobs passed or were skipped (no relevant changes)."
